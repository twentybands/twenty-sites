<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>twenty hub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap');

body{
  margin:0;
  font-family:Orbitron;
  color:white;
  overflow-x:hidden;
  background:black;
}

/* 🎥 VIDEO BACKGROUND */
#bg-video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  opacity:0.35;
}

/* 🌌 OVERLAY */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #00f0ff55, transparent 40%),
    radial-gradient(circle at 80% 80%, #ff003355, transparent 40%),
    rgba(0,0,0,0.65);
  z-index:-2;
}

/* MAIN */
.container{
  max-width:900px;
  margin:auto;
  padding:30px;
  text-align:center;
}

/* PROFILE */
.profile img{
  width:120px;
  height:120px;
  border-radius:50%;
  border:2px solid #00f0ff;
  box-shadow:0 0 25px #00f0ff;
}

/* GLITCH NAME */
.username{
  font-size:38px;
  font-weight:800;
  position:relative;
  display:inline-block;
  margin-top:10px;
}

.username::before,
.username::after{
  content:attr(data-text);
  position:absolute;
  left:0;
  top:0;
}

.username::before{
  color:#ff0033;
  animation:glitch1 0.25s infinite;
}

.username::after{
  color:#00f0ff;
  animation:glitch2 0.25s infinite;
}

@keyframes glitch1{
  0%{transform:translate(0)}
  50%{transform:translate(-2px,2px)}
  100%{transform:translate(2px,-2px)}
}

@keyframes glitch2{
  0%{transform:translate(0)}
  50%{transform:translate(2px,-2px)}
  100%{transform:translate(-2px,2px)}
}

/* DISCORD */
.discord{
  color:#aaa;
  font-size:13px;
}

/* SECTION */
.section{
  margin-top:35px;
  text-align:left;
}

.section h2{
  color:#00f0ff;
  border-left:3px solid #00f0ff;
  padding-left:10px;
}

/* ITEM CARDS */
.item{
  background:rgba(255,255,255,0.05);
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid transparent;
  transition:0.2s;
  position:relative;
}

.item:hover{
  transform:scale(1.03);
  border:1px solid #00f0ff;
  box-shadow:0 0 15px #00f0ff55;
}

.tag{ color:#00f0ff; }

.status{
  float:right;
  font-size:12px;
  color:#aaa;
}

/* COPY */
.copy{
  position:absolute;
  right:10px;
  top:10px;
  font-size:11px;
  color:#00f0ff;
  opacity:0;
  cursor:pointer;
  transition:0.2s;
}

.item:hover .copy{
  opacity:1;
}
</style>
</head>

<body>

<!-- 🎥 VIDEO BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="./assets/background.mp4" type="video/mp4">
</video>

<div class="container">

  <!-- PROFILE -->
  <div class="profile">
    <img src="https://i.imgur.com/SEU_PFP.jpg">
    <div class="username" data-text="@twenty">@twenty</div>
    <div class="discord">Discord: 20931412</div>
  </div>

  <!-- PT -->
  <div class="section">
    <h2>PT USERS</h2>

    <div class="item"><span class="tag">@aplicabilidade</span> - 4€ <span class="status">AVAILABLE</span></div>
    <div class="item"><span class="tag">@ofuscacao</span> - 7€ <span class="status">AVAILABLE</span></div>
    <div class="item"><span class="tag">@criptoanalise</span> - 10€ <span class="status">AVAILABLE</span></div>
    <div class="item"><span class="tag">@desfavorecimento</span> - 3€ <span class="status">AVAILABLE</span></div>
  </div>

  <!-- ENG -->
  <div class="section">
    <h2>ENG USERS</h2>

    <div class="item"><span class="tag">@imponderably</span> - 15€ <span class="status">AVAILABLE</span></div>
    <div class="item"><span class="tag">@syntonin</span> - 18€ <span class="status">AVAILABLE</span></div>
    <div class="item"><span class="tag">@mockground</span> - 5€ <span class="status">AVAILABLE</span></div>
  </div>

</div>

</body>
</html>
